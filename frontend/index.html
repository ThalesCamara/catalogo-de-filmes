<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineMatch | Encontre seu próximo filme</title>
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
<header>
<a class="logo" href="index.html" aria-label="CineMatch — página inicial"><span>Cine</span>Match</a>
<nav id="menu-usuario" aria-label="Menu principal">
<button id="botao-favoritos" onclick="irFavoritos()">Favoritos</button>

</div>
</nav>
</header>
<main>
<div class="page-heading">
<div>

</div>
</div>
<p id="mensagem" class="mensagem" role="status"></p>
<div id="filmes" class="filmes-grid" aria-live="polite"></div>
</main>
<script src="js/api.js?v=10"></script>
